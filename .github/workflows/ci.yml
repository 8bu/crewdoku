# Public repo: standard runners are free here. Lint/test/build take ~6s after
# install; the Playwright E2E run (browser install, own build, specs) is the
# slowest step — so this file still optimizes for *not running* and for
# failing fast, in that order.
#
# - push only: `pull_request` would double-run the same SHA (no forks here).
# - paths-ignore: wayfinder scratch, docs, and local agent tooling can't break
#   the build. NOTE: if branch protection with a required CI check is ever
#   enabled, remove paths-ignore (a skipped run posts no status and would
#   leave the required check pending forever).
# - one job: setup+install (~40s) dominates and would be paid once per job;
#   splitting lint/test/build would 3x that fixed cost to parallelize ~6s of
#   work.
# - no turbo/actions cache beyond the pnpm store: a cache round-trip costs
#   more than the tasks it would save at this scale.
# - pnpm version comes from package.json `packageManager` — the single pin.
name: CI
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.codex/**'
      - '.github/hooks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Cheapest, highest-signal first: tsc catches most real breakage;
      # vite build (esbuild, type-blind) almost never fails independently.
      - run: pnpm -w lint
      - run: pnpm -w test
      - run: pnpm -w build
      # Last: the slowest step, and it only means something once the rest pass.
      - run: pnpm --filter @crewdoku/app exec playwright install --with-deps chromium
      - run: pnpm -w e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
